<style>
/* Layout: dark lacquer showroom. Sticky header, sun-glow hero with the chrome emblem, route ribbon, filterable catalog, car sheet as a dialog. */
:root{
  --ink:#0e1013; --panel:#16191e; --panel2:#1c2027; --line:#2a2f37;
  --fg:#eceef1; --muted:#9aa2ad; --faint:#6c7480;
  --sun:#d7192a; --sun-soft:rgba(215,25,42,.16); --ok:#3fb27f; --wait:#d9a441;
  --chrome:linear-gradient(180deg,#fbfcfd 0%,#c3c9d1 38%,#7d8691 52%,#e6eaee 70%,#9aa2ad 100%);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hdr:rgba(14,16,19,.86); --ghost:rgba(236,238,241,.14); --emblem-sh:rgba(0,0,0,.55); --glow:rgba(215,25,42,.28);
  --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --ink:#f3f4f6; --panel:#ffffff; --panel2:#e9ecf0; --line:#dce0e5;
  --fg:#15181d; --muted:#59616c; --faint:#88909a;
  --sun:#c8102e; --sun-soft:rgba(200,16,46,.08); --ok:#1f9e66; --wait:#c48a1c;
  --hdr:rgba(243,244,246,.88); --ghost:rgba(21,24,29,.10); --emblem-sh:rgba(40,10,10,.22); --glow:rgba(215,25,42,.16);
  color-scheme:light}}
:root[data-theme="light"]{
  --ink:#f3f4f6; --panel:#ffffff; --panel2:#e9ecf0; --line:#dce0e5;
  --fg:#15181d; --muted:#59616c; --faint:#88909a;
  --sun:#c8102e; --sun-soft:rgba(200,16,46,.08); --ok:#1f9e66; --wait:#c48a1c;
  --hdr:rgba(243,244,246,.88); --ghost:rgba(21,24,29,.10); --emblem-sh:rgba(40,10,10,.22); --glow:rgba(215,25,42,.16);
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chrome{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .dot{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff4a55,var(--sun) 55%,#8e0c18);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.brand b{font-family:var(--display);font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);line-height:1}
nav.main{display:flex;gap:22px;margin-left:auto}
nav.main a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
nav.main a:hover{color:var(--fg)}
.tbtn{background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);padding:0}
.tbtn:hover{color:var(--fg)}
.tbtn svg{width:17px;height:17px}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{background:none;border:0;padding:5px 10px;border-radius:999px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
@media (max-width:820px){nav.main{display:none}.langs{margin-left:auto}}
.status{color:#eceef1}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;right:-12%;top:-30%;width:70vw;max-width:820px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--glow),rgba(215,25,42,0) 62%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:64px 56px}
.hero h1{font-size:clamp(30px,4.6vw,56px);line-height:1.08}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p.lead{color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:34em;margin:18px 0 28px}
.hero .emblem{max-width:100%;width:440px;justify-self:end;filter:drop-shadow(0 30px 40px var(--emblem-sh))}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:999px;font-weight:700;text-decoration:none;border:1px solid transparent;font-size:15px}
.btn.red{background:var(--sun);color:#fff}
.btn.red:hover{background:#ec2234}
.btn.ghost{border-color:var(--line);background:var(--panel)}
.btn.ghost:hover{border-color:var(--faint)}
.btn svg{width:18px;height:18px;flex:none}
.facts{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:40px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.facts span{color:var(--muted);font-size:13px;max-width:16em}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;padding-block:36px 40px;gap:20px}
  .hero .emblem{order:-1;width:220px;justify-self:start}
}

/* route */
.route{padding-block:56px}
.route ol{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s}
.route li{position:relative;padding:22px 20px 0 0;border-top:2px solid var(--line);min-width:0}
.route li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;top:-13px;left:0;background:var(--ink);padding-right:10px;font-family:var(--mono);font-size:13px;color:var(--sun)}
.route li:first-child{border-top-color:var(--sun)}
.route li b{display:block;font-size:17px;margin-bottom:4px}
.route li span{color:var(--muted);font-size:14px}
.route .total{margin-top:26px;font-family:var(--mono);font-size:13px;color:var(--muted)}
@media (max-width:820px){.route ol{grid-template-columns:1fr 1fr;row-gap:30px}}
@media (max-width:460px){.route ol{grid-template-columns:1fr}}

/* catalog */
.catalog{padding-block:24px 64px}
.cat-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.cat-head h2{font-size:clamp(24px,3vw,34px)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.7;margin-left:4px}
.sep{width:1px;background:var(--line);margin:4px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--faint);transform:translateY(-2px)}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--panel2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;background:
  radial-gradient(circle at 78% 30%,var(--sun-soft),transparent 45%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 12px),var(--panel2)}
.ph .none b{font-family:var(--display);font-size:28px;line-height:1;color:var(--ghost);letter-spacing:.02em}
.ph .none span{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px;letter-spacing:.06em}
.status{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(14,16,19,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status.wait i{background:var(--wait)}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.card h3{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:0}
.card h3 small{display:block;font-weight:600;color:var(--muted);font-size:14px}
.specs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.specs .awd{color:var(--fg);font-weight:700}
.ship{font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center;min-width:0}
.ship svg{width:14px;height:14px;flex:none}
.ship span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price b{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.price small{display:block;color:var(--muted);font-size:11px;font-family:var(--body);font-weight:500}
.price .ge{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.price .ge strong{color:var(--fg);font-size:15px}
.empty{color:var(--muted);padding:40px 0}

/* why / delivery / faq */
section.band{padding-block:64px;border-top:1px solid var(--line)}
.band h2{font-size:clamp(24px,3vw,34px);margin-bottom:26px}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.why div{min-width:0}
.why b{display:block;font-size:17px;margin-bottom:6px}
.why p{margin:0;color:var(--muted);font-size:14px}
.why svg{width:26px;height:26px;color:var(--sun);margin-bottom:12px}
@media (max-width:900px){.why{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.why{grid-template-columns:1fr}}
.dest{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.dest article{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0;display:flex;flex-direction:column;gap:10px}
.dest h3{font-size:19px}
.dest .flag{box-shadow:0 0 0 1px var(--line);display:flex;height:6px;width:54px;border-radius:2px;overflow:hidden}
.dest .flag i{flex:1}

.sheet{display:grid;grid-template-columns:1.1fr .9fr;min-width:0}
.gal{background:var(--panel2);min-width:0}
.gal .main{aspect-ratio:4/3;max-width:100%;position:relative}
.gal .main img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.thumbs button{border:2px solid transparent;padding:0;border-radius:8px;overflow:hidden;width:76px;flex:none;aspect-ratio:4/3;background:none}
.thumbs button[aria-current="true"]{border-color:var(--sun)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.info h2{font-size:22px}
.info .sub{color:var(--muted);font-weight:600;margin-top:4px}
.close{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(14,16,19,.8);font-size:20px;line-height:1;z-index:2}
table.kv{width:100%;border-collapse:collapse;font-size:14px}
table.kv td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--muted);width:44%;padding-right:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.note{background:var(--sun-soft);border:1px solid rgba(215,25,42,.4);border-radius:10px;padding:10px 12px;font-size:14px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prices div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.prices b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.prices small{color:var(--muted);font-size:12px;display:block}
.prices .ua{border-color:rgba(215,25,42,.5)}
.book{color:var(--muted);font-size:13px;margin:0}

}

function pretty(g){
  return g.replace(/^HYBRID\s+/,"").replace("E-POWER","e-Power").split(" ").map(w=>{
    if(/^(e-Power|X|S|FOUR|2|240S|2\.4Z|2\.5Z|A|G)$/.test(w))return w==="2"?"II":w;
    return w.charAt(0)+w.slice(1).toLowerCase();}).join(" ").replace("Autech","AUTECH").replace("S FOUR","S FOUR");
}
function title(c){const mdl=c.model;let g=pretty(c.grade);if(c.fam==="note"&&!/e-Power/.test(g))g="e-Power "+g;return{mdl,g}}
function eng(c){return c.fam==="note"?"1.2 "+t("epower"):(c.engine/1000).toFixed(1)+" "+t("petrol")}
function opts(c){
  const a=c.acc.split(/\s(?=[A-Z0-9])/),s=c.acc;const out=[];
  if(/GOLDEN EYES/.test(c.grade))out.push(OPTS.GOLDEN[LI[lang]]);
  ["Power Slide Door","Body Kit","Sunroof","Back Camera","360 Degree Camera","Rear Spoiler","Side Airbag"].forEach(k=>{if(s.includes(k))out.push(OPTS[k][LI[lang]])});
  if(s.includes("Push Start")&&s.includes("Keyless"))out.push(OPTS.SMART[LI[lang]]);else if(s.includes("Push Start"))out.push(OPTS["Push Start"][LI[lang]]);
  return out;
}

  <div class="info"><div><p class="eyebrow">№ ${c.ref}</p><h2 id="dlgTitle">${mdl} ${c.fam==="minivan"?c.gen:""}</h2><div class="sub">${g}</div></div>

  <p class="book">${t("book")}</p>

  <table class="kv"><tr><td>${t("k_status")}</td><td>${status}</td></tr><tr><td>${t("k_year")}</td><td>${c.year}</td></tr><tr><td>${t("k_mileage")}</td><td>${nf(c.mileage)} ${t("km")}</td></tr><tr><td>${t("k_engine")}</td><td>${eng(c)}</td></tr><tr><td>${t("k_drive")}</td><td>${c.drive==="4WD"?"4WD, "+t("awd"):t("fwd")}</td></tr><tr><td>${t("k_color")}</td><td>${COLORS[c.color]?COLORS[c.color][LI[lang]]:c.color}</td></tr><tr><td>${t("k_route")}</td><td>${shipLine(c)}</td></tr></table>

  <div class="ctas"><a class="btn red" href="https://wa.me/380663666886?text=${text}" target="_blank" rel="noopener">WhatsApp · ${t("write")}</a><a class="btn ghost" href="https://t.me/+380663666886" target="_blank" rel="noopener">Telegram</a></div>
